<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">ABEmail animated capability matrix</title><desc id="desc">Animated matrix of ABEmail mail, security, operations, and infrastructure capabilities.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04060b"/><stop offset="1" stop-color="#0d1020"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8ea1ff" stroke-opacity=".06"/></pattern>
</defs>
<rect width="1400" height="440" rx="26" fill="url(#bg)"/>
<rect width="1400" height="440" rx="26" fill="url(#grid)"/>
<text x="44" y="45" fill="#8cf7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3">ABEMAIL CAPABILITY MATRIX // MODULES ONLINE</text>
<g font-family="Arial, Helvetica, sans-serif">
 <g transform="translate(44 76)">
  <g><rect width="300" height="130" rx="20" fill="#09111d" stroke="#2dd4bf" stroke-opacity=".55"/><text x="22" y="31" fill="#dce8ff" font-size="17" font-weight="700">MAIL CORE</text><text x="22" y="55" fill="#7d8ba4" font-size="11">inbox · sent · search · state</text><g fill="#5eead4" font-size="11"><text x="22" y="84">● inbox / sent</text><text x="22" y="103">● search / filter</text><text x="150" y="84">● star / trash</text><text x="150" y="103">● mark all read</text></g><circle cx="270" cy="30" r="7" fill="#34d399" filter="url(#glow)"><animate attributeName="r" values="5;11;5" dur="1.3s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(340 0)"><rect width="300" height="130" rx="20" fill="#0d0b1c" stroke="#a78bfa" stroke-opacity=".55"/><text x="22" y="31" fill="#e8ddff" font-size="17" font-weight="700">COMPOSER</text><text x="22" y="55" fill="#8c84a9" font-size="11">reply · forward · drafts · files</text><g fill="#c4b5fd" font-size="11"><text x="22" y="84">● reply / reply all</text><text x="22" y="103">● forward</text><text x="170" y="84">● attachments</text><text x="170" y="103">● autosave</text></g><path d="M257 92 q18 -18 30 0" fill="none" stroke="#c4b5fd" stroke-width="2"><animate attributeName="d" values="M257 92 q18 -18 30 0;M257 92 q18 -26 30 0;M257 92 q18 -18 30 0" dur="1.8s" repeatCount="indefinite"/></path></g>
  <g transform="translate(680 0)"><rect width="300" height="130" rx="20" fill="#0b1118" stroke="#38bdf8" stroke-opacity=".55"/><text x="22" y="31" fill="#dcf6ff" font-size="17" font-weight="700">INFRASTRUCTURE</text><text x="22" y="55" fill="#7d8ba4" font-size="11">Auth · database · provider bridge</text><g fill="#7dd3fc" font-size="11"><text x="22" y="84">● Supabase Auth</text><text x="22" y="103">● PostgreSQL</text><text x="164" y="84">● Resend</text><text x="164" y="103">● Vercel</text></g><rect x="22" y="113" width="244" height="3" rx="1.5" fill="#172536"/><rect x="22" y="113" width="185" height="3" rx="1.5" fill="#38bdf8"><animate attributeName="width" values="60;230;140;60" dur="3s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(1020 0)"><rect width="300" height="130" rx="20" fill="#150c12" stroke="#fb7185" stroke-opacity=".55"/><text x="22" y="31" fill="#ffe3ea" font-size="17" font-weight="700">OPERATIONS</text><text x="22" y="55" fill="#a98b94" font-size="11">admin · incidents · audit · health</text><g fill="#fda4af" font-size="11"><text x="22" y="84">● monitoring</text><text x="22" y="103">● incidents</text><text x="162" y="84">● audit</text><text x="162" y="103">● capacity</text></g><circle cx="268" cy="96" r="9" fill="none" stroke="#fb7185"><animate attributeName="r" values="4;15;4" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.1;1" dur="1.8s" repeatCount="indefinite"/></circle></g>
 </g>
 <g transform="translate(44 232)">
  <g><rect width="620" height="150" rx="20" fill="#081419" stroke="#34d399" stroke-opacity=".5"/><text x="24" y="34" fill="#dcfff4" font-size="17" font-weight="700">SECURITY BOUNDARY</text><text x="24" y="59" fill="#7b958e" font-size="11">server-side secrets · scoped access · verified events</text><g fill="#6ee7b7" font-size="12"><text x="24" y="91">✓ Authenticated APIs</text><text x="24" y="117">✓ Mailbox-level scoping</text><text x="270" y="91">✓ Row Level Security (RLS)</text><text x="270" y="117">✓ Private attachment access</text><text x="24" y="141">✓ Signed webhook verification</text><text x="315" y="141">✓ Admin allowlist + audit trail</text></g></g>
  <g transform="translate(660 0)"><rect width="660" height="150" rx="20" fill="#0e101a" stroke="#818cf8" stroke-opacity=".5"/><text x="24" y="34" fill="#e9e7ff" font-size="17" font-weight="700">OBSERVABILITY GRID</text><text x="24" y="59" fill="#8f92ad" font-size="11">the system watches the system</text><g fill="#a5b4fc" font-size="12"><text x="24" y="91">◉ system events</text><text x="24" y="117">◉ provider events</text><text x="230" y="91">◉ incidents</text><text x="230" y="117">◉ user reports</text><text x="420" y="91">◉ health checks</text><text x="420" y="117">◉ audit trail</text></g><g stroke="#818cf8" stroke-opacity=".25"><path d="M24 136 H624"/><path d="M24 136 H180" stroke="#818cf8" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 600;180 420;0 600" dur="3.5s" repeatCount="indefinite"/></path></g></g>
 </g>
</g>
<text x="700" y="416" text-anchor="middle" fill="#66738c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="3">MAIL • DATA • DELIVERY • SECURITY • OPERATIONS</text>
</svg>