<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">ABEmail capability matrix</title><desc id="desc">Static capability matrix for ABEmail Mail covering mailbox, composition, infrastructure and operations.</desc><rect width="1400" height="520" rx="28" fill="#0a0d16"/><text x="70" y="70" fill="#62f7ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="2">ABEMAIL / CAPABILITY MATRIX</text><text x="70" y="112" fill="#f4f7ff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">One mailbox. One operations surface.</text><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(70 160)"><rect width="290" height="280" rx="20" fill="#101827" stroke="#37e6ff" stroke-opacity=".28"/><text x="26" y="42" fill="#63f4ff" font-size="13" font-weight="700">MAIL WORKSPACE</text><text x="26" y="82" fill="white" font-size="18">Inbox / All Mail</text><text x="26" y="114" fill="white" font-size="18">Sent / Starred / Trash</text><text x="26" y="146" fill="white" font-size="18">Search / Filtering</text><text x="26" y="178" fill="white" font-size="18">Read / Unread</text><text x="26" y="210" fill="white" font-size="18">Responsive navigation</text><text x="26" y="248" fill="#7c8aa9" font-size="12">mailbox state stays persistent</text></g><g transform="translate(385 160)"><rect width="290" height="280" rx="20" fill="#111827" stroke="#b78cff" stroke-opacity=".30"/><text x="26" y="42" fill="#b78cff" font-size="13" font-weight="700">COMPOSITION</text><text x="26" y="82" fill="white" font-size="18">New message</text><text x="26" y="114" fill="white" font-size="18">Reply / Reply All</text><text x="26" y="146" fill="white" font-size="18">Forward</text><text x="26" y="178" fill="white" font-size="18">Attachments</text><text x="26" y="210" fill="white" font-size="18">Drafts / Autosave</text><text x="26" y="248" fill="#7c8aa9" font-size="12">safe quoted-message handling</text></g><g transform="translate(700 160)"><rect width="290" height="280" rx="20" fill="#111827" stroke="#ff75b8" stroke-opacity=".25"/><text x="26" y="42" fill="#ff75b8" font-size="13" font-weight="700">INFRASTRUCTURE</text><text x="26" y="82" fill="white" font-size="18">Resend transport</text><text x="26" y="114" fill="white" font-size="18">Inbound webhooks</text><text x="26" y="146" fill="white" font-size="18">PostgreSQL persistence</text><text x="26" y="178" fill="white" font-size="18">Delivery events</text><text x="26" y="210" fill="white" font-size="18">Private storage</text><text x="26" y="248" fill="#7c8aa9" font-size="12">provider events are idempotent</text></g><g transform="translate(1015 160)"><rect width="290" height="280" rx="20" fill="#111827" stroke="#62f7ff" stroke-opacity=".25"/><text x="26" y="42" fill="#62f7ff" font-size="13" font-weight="700">OPERATIONS</text><text x="26" y="82" fill="white" font-size="18">Monitoring</text><text x="26" y="114" fill="white" font-size="18">Incidents</text><text x="26" y="146" fill="white" font-size="18">Mailboxes / Users</text><text x="26" y="178" fill="white" font-size="18">Audit history</text><text x="26" y="210" fill="white" font-size="18">Capacity / Usage</text><text x="26" y="248" fill="#7c8aa9" font-size="12">admin controls stay server-authorized</text></g></g></svg>