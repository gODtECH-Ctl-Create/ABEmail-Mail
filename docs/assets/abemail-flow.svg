<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">ABEmail mail flow</title><desc id="desc">Static mail flow from external sender through Resend, the ABEmail API and Supabase PostgreSQL to the mailbox, with outbound delivery returning through Resend.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070c"/><stop offset="1" stop-color="#12071c"/></linearGradient></defs><rect width="1400" height="520" rx="28" fill="url(#bg)"/><text x="70" y="66" fill="#62f7ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="2">ABEMAIL / LIVE MAIL FLOW</text><text x="70" y="106" fill="#f4f7ff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">Secure, signed, persisted mail delivery.</text><g font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle"><g transform="translate(60 190)"><rect width="190" height="110" rx="18" fill="#101827" stroke="#62f7ff" stroke-opacity=".28"/><text x="95" y="45" fill="#63f4ff">External sender</text><text x="95" y="72" fill="#9da9be">message enters</text></g><g transform="translate(290 190)"><rect width="190" height="110" rx="18" fill="#111827" stroke="#b78cff" stroke-opacity=".28"/><text x="95" y="45" fill="#b78cff">Resend</text><text x="95" y="72" fill="#9da9be">receive / deliver</text></g><g transform="translate(520 190)"><rect width="190" height="110" rx="18" fill="#10161f" stroke="#ff75b8" stroke-opacity=".28"/><text x="95" y="45" fill="#ff75b8">ABEmail API</text><text x="95" y="72" fill="#9da9be">signed webhook</text></g><g transform="translate(750 190)"><rect width="190" height="110" rx="18" fill="#101827" stroke="#62f7ff" stroke-opacity=".28"/><text x="95" y="45" fill="#63f4ff">Supabase</text><text x="95" y="72" fill="#9da9be">PostgreSQL persistence</text></g><g transform="translate(980 190)"><rect width="190" height="110" rx="18" fill="#111827" stroke="#b78cff" stroke-opacity=".28"/><text x="95" y="45" fill="#b78cff">Mailbox</text><text x="95" y="72" fill="#9da9be">read / search / reply</text></g></g><g stroke="#7c8aa9" stroke-width="3" fill="none"><path d="M250 245H290"/><path d="M480 245H520"/><path d="M710 245H750"/><path d="M940 245H980"/></g><g fill="#62f7ff"><path d="M282 237l12 8-12 8"/><path d="M512 237l12 8-12 8"/><path d="M742 237l12 8-12 8"/><path d="M972 237l12 8-12 8"/></g><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12"><rect x="150" y="360" width="1100" height="70" rx="18" fill="#0b1220" stroke="#ffffff" stroke-opacity=".08"/><text x="180" y="389" fill="#a7b0c2">OUTBOUND</text><text x="310" y="389" fill="#e8edf7">Mailbox → authenticated ABEmail API → Resend → external recipient</text><text x="180" y="412" fill="#7c8aa9">Delivery events return through the provider-event ingestion path.</text></g></svg>