<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
<title id="title">ABEmail animated mail flow</title><desc id="desc">Animated message flow from sender to Resend, ABEmail API, Supabase, inbox and back to an external recipient.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#05070c"/><stop offset=".5" stop-color="#0c1220"/><stop offset="1" stop-color="#090611"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7c8cff" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1400" height="300" rx="26" fill="url(#bg)"/>
<rect width="1400" height="300" rx="26" fill="url(#grid)"/>
<text x="38" y="38" fill="#7ef9ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="3">LIVE MAIL TRANSPORT // PACKET VISUALIZATION</text>
<g stroke="#243047" stroke-width="2" fill="none">
 <path d="M135 137 H1250"/><path d="M135 163 H1250"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
 <g transform="translate(95 92)"><rect width="120" height="115" rx="20" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".55"/><text x="60" y="37" fill="#dce8ff" font-size="18" font-weight="700">SENDER</text><text x="60" y="63" fill="#76849f" font-size="11">external mail</text><circle cx="60" cy="87" r="8" fill="#38bdf8" filter="url(#glow)"><animate attributeName="r" values="6;12;6" dur="1.7s" repeatCount="indefinite"/></circle></g>
 <g transform="translate(305 92)"><rect width="120" height="115" rx="20" fill="#0b1220" stroke="#a78bfa" stroke-opacity=".55"/><text x="60" y="37" fill="#dce8ff" font-size="18" font-weight="700">RESEND</text><text x="60" y="63" fill="#76849f" font-size="11">receive / send</text><text x="60" y="90" fill="#a78bfa" font-size="12">WEBHOOK</text></g>
 <g transform="translate(515 92)"><rect width="150" height="115" rx="20" fill="#0b1220" stroke="#7dd3fc" stroke-opacity=".55"/><text x="75" y="37" fill="#dce8ff" font-size="18" font-weight="700">ABEMAIL API</text><text x="75" y="63" fill="#76849f" font-size="11">verify + normalize</text><text x="75" y="90" fill="#62f7ff" font-size="12">AUTHENTICATED</text></g>
 <g transform="translate(755 92)"><rect width="150" height="115" rx="20" fill="#0b1220" stroke="#34d399" stroke-opacity=".55"/><text x="75" y="37" fill="#dce8ff" font-size="18" font-weight="700">SUPABASE</text><text x="75" y="63" fill="#76849f" font-size="11">PostgreSQL + Auth</text><text x="75" y="90" fill="#34d399" font-size="12">PERSISTED</text></g>
 <g transform="translate(995 92)"><rect width="150" height="115" rx="20" fill="#0b1220" stroke="#f472b6" stroke-opacity=".55"/><text x="75" y="37" fill="#dce8ff" font-size="18" font-weight="700">MAILBOX</text><text x="75" y="63" fill="#76849f" font-size="11">inbox / sent / search</text><text x="75" y="90" fill="#f472b6" font-size="12">VISIBLE</text></g>
 <g transform="translate(1235 92)"><rect width="110" height="115" rx="20" fill="#0b1220" stroke="#fb7185" stroke-opacity=".55"/><text x="55" y="37" fill="#dce8ff" font-size="17" font-weight="700">OUT</text><text x="55" y="63" fill="#76849f" font-size="11">recipient</text><circle cx="55" cy="87" r="7" fill="#fb7185" filter="url(#glow)"/></g>
</g>
<g fill="#fff" filter="url(#glow)">
 <circle r="5"><animateMotion dur="3.8s" repeatCount="indefinite" path="M155 150 H1300"/><animate attributeName="opacity" values="1;.25;1" dur="3.8s" repeatCount="indefinite"/></circle>
 <circle r="4"><animateMotion dur="3.8s" begin="1.9s" repeatCount="indefinite" path="M1300 176 H155"/><animate attributeName="opacity" values=".15;1;.15" dur="3.8s" begin="1.9s" repeatCount="indefinite"/></circle>
</g>
<text x="700" y="266" text-anchor="middle" fill="#66738c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">VERIFY → STORE → DELIVER → OBSERVE</text>
</svg>