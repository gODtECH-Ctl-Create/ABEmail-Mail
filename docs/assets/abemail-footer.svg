<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="220" viewBox="0 0 1400 220" role="img" aria-labelledby="title desc">
<title id="title">ABEmail animated system footer</title><desc id="desc">Animated transmission footer for the ABEmail Mail README.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03050a"/><stop offset=".5" stop-color="#0c1020"/><stop offset="1" stop-color="#130814"/></linearGradient>
 <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9aa8ff" opacity=".13"/></pattern>
</defs>
<rect width="1400" height="220" rx="26" fill="url(#bg)"/>
<rect width="1400" height="220" rx="26" fill="url(#dots)"/>
<path d="M80 110 H1320" stroke="#25304a" stroke-width="1"/>
<path d="M80 110 H1320" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 40" filter="url(#glow)">
 <animate attributeName="stroke-dashoffset" values="0;-840" dur="3.4s" repeatCount="indefinite"/>
</path>
<g transform="translate(700 110)" text-anchor="middle">
 <circle r="58" fill="#0a0f1b" stroke="#6e7cff" stroke-opacity=".35">
  <animate attributeName="r" values="53;66;53" dur="3s" repeatCount="indefinite"/>
 </circle>
 <circle r="38" fill="none" stroke="#38bdf8" stroke-opacity=".5" stroke-dasharray="4 8">
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
 </circle>
 <path d="M-17 -2 L0 12 L17 -2" fill="none" stroke="#8cf7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M-17 13 L-5 2 M17 13 L5 2" fill="none" stroke="#b18cff" stroke-width="2" stroke-linecap="round"/>
</g>
<text x="700" y="49" text-anchor="middle" fill="url(#neon)" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="7">TRANSMISSION COMPLETE</text>
<text x="700" y="82" text-anchor="middle" fill="#7d8aa6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="3">ABEMAIL MAIL // ORGANIZATION-OWNED // OPERATIONS-READY</text>
<text x="700" y="180" text-anchor="middle" fill="#62708a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">© ABE TECH LAB / gODtECH • KEEP THE BRAND • KEEP THE BOUNDARIES • SHIP WITH INTENT</text>
</svg>