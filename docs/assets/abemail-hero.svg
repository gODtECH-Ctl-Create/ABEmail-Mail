<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">ABEmail Mail animated hero</title>
<desc id="desc">Animated neon business email system visualization for the ABEmail Mail repository.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070c"/><stop offset="0.5" stop-color="#0b1020"/><stop offset="1" stop-color="#12071c"/></linearGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#00f5ff" stop-opacity="0"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff3d81" stop-opacity="0"/></linearGradient>
  <linearGradient id="text" x1="0" x2="1"><stop stop-color="#62f7ff"/><stop offset="0.5" stop-color="#b696ff"/><stop offset="1" stop-color="#ff75b8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6e7cff" stroke-opacity="0.10"/></pattern>
  <clipPath id="clip"><rect x="0" y="0" width="1400" height="420" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1400" height="420" fill="url(#bg)"/>
<rect width="1400" height="420" fill="url(#grid)"/>
<ellipse cx="1110" cy="35" rx="280" ry="180" fill="#7c3aed" opacity="0.12" filter="url(#glow)">
  <animate attributeName="rx" values="240;310;240" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="260" cy="360" rx="250" ry="150" fill="#00d9ff" opacity="0.10" filter="url(#glow)">
  <animate attributeName="ry" values="125;175;125" dur="6s" repeatCount="indefinite"/>
</ellipse>
<g opacity="0.7">
  <path d="M-50 305 C220 170 460 405 720 230 S1140 90 1450 230" fill="none" stroke="url(#beam)" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="20 70;130 30;20 70" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M-50 325 C220 190 460 425 720 250 S1140 110 1450 250" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1">
    <animate attributeName="stroke-dashoffset" values="0;-400" dur="5s" repeatCount="indefinite"/>
  </path>
</g>
<g transform="translate(86 72)">
  <rect x="0" y="0" width="1160" height="268" rx="26" fill="#090d17" fill-opacity="0.82" stroke="#8ea2ff" stroke-opacity="0.28"/>
  <rect x="20" y="20" width="1120" height="30" rx="12" fill="#111827" stroke="#7285ff" stroke-opacity="0.16"/>
  <circle cx="40" cy="35" r="4" fill="#ff5f57"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="57" cy="35" r="4" fill="#febc2e"><animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="74" cy="35" r="4" fill="#28c840"><animate attributeName="opacity" values=".65;1;.65" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="100" y="40" fill="#74809a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ABEMAIL / SYSTEM-CHANNEL</text>
  <g transform="translate(42 88)">
    <rect x="0" y="0" width="122" height="92" rx="20" fill="#0d1421" stroke="#37e6ff" stroke-opacity="0.55"/>
    <path d="M18 24 L61 58 L104 24" fill="none" stroke="#63f4ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 68 L48 42 M104 68 L74 42" fill="none" stroke="#b78cff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="61" cy="46" r="4" fill="#fff" filter="url(#glow)"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(200 86)">
    <text x="0" y="18" fill="#7ef9ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">ORGANIZATION-OWNED</text>
    <text x="0" y="67" fill="url(#text)" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-2">ABEmail Mail</text>
    <text x="0" y="98" fill="#a7b0c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">mail.workspace // infrastructure // operations</text>
    <g transform="translate(0 126)">
      <text fill="#e8edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
        <tspan>Focused business email.</tspan>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.8;1" dur="4.8s" repeatCount="indefinite"/>
      </text>
      <text fill="#e8edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
        <tspan>Send. Receive. Search. Operate.</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.18;.3;.86;1" dur="4.8s" repeatCount="indefinite"/>
      </text>
      <text fill="#e8edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
        <tspan>One organization. One mail control plane.</tspan>
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.3;.45;.56;.9;1" dur="4.8s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
  <g transform="translate(926 88)">
    <rect width="190" height="132" rx="18" fill="#0b1220" stroke="#a77cff" stroke-opacity="0.35"/>
    <text x="18" y="27" fill="#7c8aa9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">LIVE SIGNAL</text>
    <text x="18" y="59" fill="#f6f8fc" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">READY</text>
    <circle cx="151" cy="51" r="10" fill="#35e6a2"><animate attributeName="r" values="7;14;7" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <rect x="18" y="79" width="154" height="5" rx="2.5" fill="#182235"/>
    <rect x="18" y="79" width="98" height="5" rx="2.5" fill="#62f7ff"><animate attributeName="width" values="40;132;88;40" dur="3s" repeatCount="indefinite"/></rect>
    <text x="18" y="108" fill="#7c8aa9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">CONTROL // MAIL // OPS</text>
  </g>
  <text x="42" y="235" fill="#5e6a84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">ABE TECH LAB / WAST2LIGHT DEPLOYMENT • NEXT.JS • SUPABASE • RESEND • VERCEL</text>
</g>
<text x="700" y="394" text-anchor="middle" fill="#71809d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="4">SECURE MAILFLOW / OPERATIONS / PROVENANCE / CONTROL</text>
</g>
</svg>